<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lizard</title>
<style>
  html, body {
    margin: 0; padding: 0;
    overflow: hidden;
    background: #f0f0c8;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ---------- Ящерица ----------
const lizard = {
  x: W / 2,
  y: H / 2,
  angle: 0,          // угол тела
  headOffset: 0,     // поворот головы относительно тела
  speed: 2.6,
  turnSpeed: 0.13,
  walkPhase: 0,
  moving: false,
  fleeing: false,
  mouthOpen: 0,
  biting: false,
  biteTimer: 0,
  blinkTimer: 0,
  blinking: false,
  blinkDur: 0,
  lookTimer: 0,
  lookTarget: 0,
  breath: 0,
};

// ---------- Ввод ----------
let mouse = { x: W / 2, y: H / 2, down: false };

canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mousedown', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.down = true; });
canvas.addEventListener('mouseup',   () => { mouse.down = false; });

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  mouse.x = t.clientX; mouse.y = t.clientY; mouse.down = true;
  lizard.biting = true; lizard.biteTimer = 0;
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  mouse.x = t.clientX; mouse.y = t.clientY;
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  mouse.down = false;
}, { passive: false });

// ---------- Помощники ----------
function lerpAngle(a, b, t) {
  let d = b - a;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return a + d * t;
}

// ---------- Логика ----------
function update(dt) {
  const dx = mouse.x - lizard.x;
  const dy = mouse.y - lizard.y;
  const len = Math.hypot(dx, dy);

  let targetAngle = Math.atan2(dy, dx);
  lizard.fleeing = false;
  let curSpeed = lizard.speed;

  // Убегает, если палец слишком близко
  if (len < 70) {
    lizard.fleeing = true;
    targetAngle += Math.PI;
    curSpeed = lizard.speed * 1.9;
  }

  // Поворот тела
  lizard.angle = lerpAngle(lizard.angle, targetAngle, lizard.turnSpeed);

  // Движение — если смотрим примерно в нужную сторону
  let angleDiff = Math.abs(((targetAngle - lizard.angle + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
  lizard.moving = false;
  if (angleDiff < 1.1 && (len > 30 || lizard.fleeing)) {
    lizard.x += Math.cos(lizard.angle) * curSpeed;
    lizard.y += Math.sin(lizard.angle) * curSpeed;
    lizard.moving = true;
  }

  // Фаза ходьбы
  lizard.walkPhase += lizard.moving ? (lizard.fleeing ? 0.5 : 0.3) : 0.04;

  // Дыхание
  lizard.breath += dt * 2;

  // Осматривается, когда стоит
  const idle = !lizard.moving && !lizard.fleeing && !lizard.biting;
  if (idle) {
    lizard.lookTimer += dt;
    if (lizard.lookTimer > 1.6) {
      lizard.lookTarget = (Math.random() - 0.5) * Math.PI * 0.9;
      lizard.lookTimer = 0;
    }
  } else {
    lizard.lookTarget = 0;
  }
  lizard.headOffset += (lizard.lookTarget - lizard.headOffset) * 0.05;

  // Мигание
  lizard.blinkTimer += dt;
  if (!lizard.blinking && lizard.blinkTimer > 2 + Math.random() * 3) {
    lizard.blinking = true;
    lizard.blinkDur = 0;
    lizard.blinkTimer = 0;
  }
  if (lizard.blinking) {
    lizard.blinkDur += dt;
    if (lizard.blinkDur > 0.14) lizard.blinking = false;
  }

  // Укус
  if (lizard.biting) {
    lizard.biteTimer += dt;
    if (lizard.biteTimer > 0.35) lizard.biting = false;
  }

  // Рот
  let targetMouth = 0;
  if (lizard.biting) targetMouth = 8;
  else if (lizard.fleeing || len < 90) targetMouth = 4;
  lizard.mouthOpen += (targetMouth - lizard.mouthOpen) * 0.25;
}

// ---------- Рисование ----------
function drawBody() {
  const breathScale = 1 + Math.sin(lizard.breath) * 0.03;

  // Тень
  ctx.save();
  ctx.translate(lizard.x + 3, lizard.y + 5);
  ctx.rotate(lizard.angle);
  ctx.scale(breathScale, breathScale);
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath();
  ctx.ellipse(0, 0, 24, 14, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Хвост — сегменты позади тела
  const tailSegments = 7;
  for (let i = tailSegments - 1; i >= 0; i--) {
    const dist = 20 + i * 11;
    const wiggleAmp = lizard.moving ? (i + 1) * (lizard.fleeing ? 2.6 : 1.8) : (i + 1) * 0.35;
    const wobble = Math.sin(lizard.walkPhase * 0.9 - i * 0.6) * wiggleAmp;

    const tx = lizard.x - Math.cos(lizard.angle) * dist;
    const ty = lizard.y - Math.sin(lizard.angle) * dist;
    const perpX = Math.cos(lizard.angle + Math.PI / 2);
    const perpY = Math.sin(lizard.angle + Math.PI / 2);

    const px = tx + perpX * wobble;
    const py = ty + perpY * wobble;

    const r = 9 - i * 1.05;
    const grad = ctx.createRadialGradient(px - 2, py - 2, 1, px, py, r + 2);
    grad.addColorStop(0, '#8fd96b');
    grad.addColorStop(1, '#3f8a3a');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(px, py, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Лапки — 4 штуки
  const legOffsets = [
    { x:  6, y: -15, phase: 0 },
    { x: -8, y: -13, phase: Math.PI },
    { x:  6, y:  15, phase: Math.PI },
    { x: -8, y:  13, phase: 0 },
  ];

  for (const leg of legOffsets) {
    const step = Math.sin(lizard.walkPhase + leg.phase);
    const stepFwd = lizard.moving ? step * (lizard.fleeing ? 7 : 5) : step * 0.5;
    const lift = lizard.moving ? Math.max(0, step) * (lizard.fleeing ? 2.5 : 1.8) : 0;

    const lx = leg.x + stepFwd;
    const ly = leg.y;

    const worldX = lizard.x + Math.cos(lizard.angle) * lx - Math.sin(lizard.angle) * ly;
    const worldY = lizard.y + Math.sin(lizard.angle) * lx + Math.cos(lizard.angle) * ly;

    ctx.save();
    ctx.translate(worldX, worldY - lift);
    ctx.rotate(lizard.angle + (ly < 0 ? -0.5 : 0.5));
    ctx.fillStyle = '#4a9b3d';
    ctx.strokeStyle = '#2b5d24';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(0, 0, 8, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  // Тело
  ctx.save();
  ctx.translate(lizard.x, lizard.y);
  ctx.rotate(lizard.angle);
  ctx.scale(breathScale, breathScale);

  const bodyGrad = ctx.createRadialGradient(-4, -4, 2, 0, 0, 22);
  bodyGrad.addColorStop(0, '#a8e884');
  bodyGrad.addColorStop(1, '#4a9b3d');
  ctx.fillStyle = bodyGrad;
  ctx.strokeStyle = '#2b5d24';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(0, 0, 22, 13, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // Пятнышки на спине
  ctx.fillStyle = 'rgba(43,93,36,0.5)';
  for (let i = 0; i < 5; i++) {
    const px = -12 + i * 6;
    const py = Math.sin(i * 1.3) * 3;
    ctx.beginPath();
    ctx.arc(px, py, 1.6, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // Голова — поворачивается отдельно
  const finalHeadAngle = lizard.angle + lizard.headOffset;
  const headBaseX = lizard.x + Math.cos(lizard.angle) * 18;
  const headBaseY = lizard.y + Math.sin(lizard.angle) * 18;
  const headX = headBaseX + Math.cos(finalHeadAngle) * 6;
  const headY = headBaseY + Math.sin(finalHeadAngle) * 6;

  ctx.save();
  ctx.translate(headX, headY);
  ctx.rotate(finalHeadAngle);

  const headGrad = ctx.createRadialGradient(-2, -3, 1, 0, 0, 14);
  headGrad.addColorStop(0, '#b5ec95');
  headGrad.addColorStop(1, '#5cb04a');
  ctx.fillStyle = headGrad;
  ctx.strokeStyle = '#2b5d24';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(0, 0, 12, 10, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // Рот
  if (lizard.mouthOpen > 0.3) {
    ctx.strokeStyle = '#1a3d16';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(2, 3);
    ctx.lineTo(2 + lizard.mouthOpen, 3);
    ctx.stroke();

    // Язык при укусе
    if (lizard.biting && lizard.mouthOpen > 3) {
      ctx.strokeStyle = '#e5486a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(2, 3);
      ctx.lineTo(2 + lizard.mouthOpen * 1.3, 3);
      ctx.stroke();
    }
  }

  // Глаз
  const eyeX = 2;
  const eyeY = -3.5;
  if (!lizard.blinking) {
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(eyeX, eyeY, 3.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#1a3d16';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(eyeX + 1, eyeY, 1.8, 0, Math.PI * 2);
    ctx.fill();

    // Блик
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.arc(eyeX + 0.3, eyeY - 0.8, 0.6, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.strokeStyle = '#2b5d24';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(eyeX - 3.5, eyeY);
    ctx.lineTo(eyeX + 3.5, eyeY);
    ctx.stroke();
  }

  // Ноздря
  ctx.fillStyle = '#1a3d16';
  ctx.beginPath();
  ctx.arc(9, -1, 0.9, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// ---------- Цикл ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;

  update(dt);

  ctx.clearRect(0, 0, W, H);

  // Лёгкая трава-фон
  ctx.fillStyle = '#f0f0c8';
  ctx.fillRect(0, 0, W, H);

  drawBody();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
